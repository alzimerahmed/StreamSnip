name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      # Apple actool regression (FB20183399): compiling an Icon Composer .icon
      # for macOS crashes AssetCatalogAgent on Xcode <= 26.3. The tvOS job
      # still compiles StreamSnip.icon, so coverage is kept; drop it here and
      # fall back to the legacy AppIcon.appiconset until runners ship 26.4.1.
      - name: Work around actool .icon crash (FB20183399)
        run: |
          rm -rf StreamSnip.icon
          sed -i.bak '/StreamSnip\.icon/d' StreamSnip.xcodeproj/project.pbxproj

      - name: Build for testing
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Debug
          -destination 'platform=macOS'
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      # CredentialIdentityScope/CredentialReplacement/LegacyCredentialAdoption
      # exercise real Keychain synchronizable items + iCloud identity state —
      # unavailable on an unsigned test host (ADR-005). unreachableStatusExpires
      # and generationFenceDropsStaleResults are timing-sensitive flakes under
      # investigation (sub-100ms retry windows). All run on a signed dev machine.
      - name: Run unit tests
        run: >
          xcodebuild test-without-building
          -scheme StreamSnip
          -destination 'platform=macOS'
          -only-testing:StreamSnipTests
          -skip-testing:StreamSnipTests/CredentialIdentityScopeTests
          -skip-testing:StreamSnipTests/CredentialReplacementTests
          -skip-testing:StreamSnipTests/LegacyCredentialAdoptionTests
          -skip-testing:'StreamSnipTests/AccountsManagerTests/unreachableStatusExpires'
          -skip-testing:'StreamSnipTests/RemotePlaylistsCacheTests/generationFenceDropsStaleResults'
          -resultBundlePath TestResults.xcresult
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon
          CODE_SIGNING_ALLOWED=NO
        continue-on-error: true

      - name: Collect test diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp -R TestResults.xcresult diagnostics/ 2>/dev/null || true
          cp -R ~/Library/Logs/DiagnosticReports diagnostics/crash-logs 2>/dev/null || true
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > diagnostics/summary.json 2>/dev/null || true

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diagnostics
          path: diagnostics
          retention-days: 7

      - name: Enforce test result
        if: always()
        run: |
          if [ ! -f diagnostics/summary.json ]; then
            echo "No result bundle — test run crashed before reporting"
            exit 1
          fi
          python3 - <<'EOF'
          import json, sys
          summary = json.load(open("diagnostics/summary.json"))
          result = summary.get("result")
          print("Test result:", result)
          sys.exit(0 if result == "Passed" else 1)
          EOF

  build-tvos:
    name: Build (tvOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build (tvOS Simulator, unsigned)
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
