name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build for testing
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      - name: Run unit tests
        run: >
          xcodebuild test-without-building
          -scheme StreamSnip
          -destination 'platform=macOS'
          -only-testing:StreamSnipTests
          CODE_SIGNING_ALLOWED=NO

  build-tvos:
    name: Build (tvOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build (tvOS Simulator, unsigned)
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
