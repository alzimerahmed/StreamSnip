name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      # Apple actool regression (FB20183399): compiling an Icon Composer .icon
      # for macOS crashes AssetCatalogAgent on Xcode <= 26.3. The tvOS job
      # still compiles StreamSnip.icon, so coverage is kept; drop it here and
      # fall back to the legacy AppIcon.appiconset until runners ship 26.4.1.
      - name: Work around actool .icon crash (FB20183399)
        run: |
          rm -rf StreamSnip.icon
          sed -i.bak '/StreamSnip\.icon/d' StreamSnip.xcodeproj/project.pbxproj

      - name: Build for testing
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Debug
          -destination 'platform=macOS'
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      - name: Run unit tests
        run: >
          xcodebuild test-without-building
          -scheme StreamSnip
          -destination 'platform=macOS'
          -only-testing:StreamSnipTests
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon
          CODE_SIGNING_ALLOWED=NO

  build-tvos:
    name: Build (tvOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build (tvOS Simulator, unsigned)
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
