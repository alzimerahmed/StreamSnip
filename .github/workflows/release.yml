name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos:
    name: Release (macOS, unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      # Release config is Sparkle-free by design (ADR-004) — safe to build unsigned.
      - name: Build (macOS, Release, unsigned)
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Zip app bundle
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*Build/Products/Release/StreamSnip.app" | head -1)
          if [ -z "$APP" ]; then echo "StreamSnip.app not found"; exit 1; fi
          cd "$(dirname "$APP")"
          zip -r -q "$RUNNER_TEMP/StreamSnip-macOS-unsigned.zip" StreamSnip.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSnip-macOS-unsigned
          path: ${{ runner.temp }}/StreamSnip-macOS-unsigned.zip

  release-ios:
    name: Release (iOS, unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build (iOS device, Release, unsigned)
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      # Unsigned .ipa: sideload via AltStore/Sideloadly/TrollStore, or re-sign
      # with a Developer ID / distribution certificate before installing.
      - name: Package unsigned IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*Release-iphoneos/StreamSnip.app" | head -1)
          if [ -z "$APP" ]; then echo "StreamSnip.app not found"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r -q StreamSnip-iOS-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSnip-iOS-unsigned
          path: ${{ runner.temp }}/StreamSnip-iOS-unsigned.ipa

  publish:
    name: Publish GitHub Release
    needs: [release-macos, release-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
