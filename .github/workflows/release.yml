name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos:
    name: Release (macOS, unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      # Release config is Sparkle-free by design (ADR-004) — safe to build unsigned.
      - name: Build (macOS, Release, unsigned)
        run: >
          xcodebuild -project StreamSnip.xcodeproj
          -scheme StreamSnip
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Zip app bundle
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*Build/Products/Release/StreamSnip.app" | head -1)
          if [ -z "$APP" ]; then echo "StreamSnip.app not found"; exit 1; fi
          cd "$(dirname "$APP")"
          zip -r -q "$RUNNER_TEMP/StreamSnip-macOS-unsigned.zip" StreamSnip.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ runner.temp }}/StreamSnip-macOS-unsigned.zip
